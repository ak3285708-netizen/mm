<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>MOONY | Угадай M&M's</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #B1B1E8 0%, #8A8AD6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .card {
            max-width: 100%;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            background: #B1B1E8;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.2);
        }

        .header {
            background: white;
            padding: 24px 16px;
            text-align: center;
        }

        .logo {
            font-family: 'Lora', serif;
            font-size: 26px;
            font-weight: 700;
            color: #B1B1E8;
            letter-spacing: 1.5px;
            margin-bottom: 6px;
        }

        .badge {
            background: #F0F0FF;
            display: inline-block;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 500;
            color: #8A8AD6;
        }

        .jar-section {
            padding: 24px 20px 12px;
            text-align: center;
        }

        .question-mark {
            font-family: 'Lora', serif;
            font-size: 56px;
            font-weight: 700;
            color: white;
            margin-bottom: 12px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .title {
            font-family: 'Lora', serif;
            font-size: 20px;
            font-weight: 600;
            color: white;
            margin-bottom: 6px;
        }

        .sub {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.85);
            font-weight: 500;
            margin-bottom: 8px;
        }

        .hint {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            background: rgba(255, 255, 255, 0.15);
            display: inline-block;
            padding: 5px 14px;
            border-radius: 30px;
        }

        .form-section {
            padding: 8px 20px 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            font-size: 18px;
            font-weight: 500;
            text-align: center;
            border: none;
            border-radius: 14px;
            font-family: 'Inter', sans-serif;
            background: white;
            color: #2D2D3A;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        input:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.5);
        }

        input:disabled {
            background: #E0E0E0;
            color: #999;
        }

        button {
            background: white;
            color: #B1B1E8;
            border: none;
            padding: 14px 20px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            width: 100%;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
        }

        button:disabled {
            background: #CCCCCC;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .result {
            margin-top: 12px;
            padding: 14px;
            border-radius: 14px;
            display: none;
            font-size: 14px;
            line-height: 1.5;
            text-align: center;
            background: white;
            word-break: break-word;
        }

        .result.show {
            display: block;
            animation: fadeInUp 0.3s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result.win {
            background: #E8F5E9;
            color: #2E7D32;
            border-left: 4px solid #4CAF50;
        }

        .result.lose {
            background: #FFF3E0;
            color: #E67E22;
            border-left: 4px solid #FF9800;
        }

        .result.blocked {
            background: #FFEBEE;
            color: #C62828;
            border-left: 4px solid #F44336;
        }

        .prize-text {
            font-weight: 700;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(0, 0, 0, 0.08);
            font-size: 14px;
        }

        .rules {
            background: rgba(255, 255, 255, 0.1);
            padding: 16px 20px;
            text-align: center;
        }

        .rules p {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.9);
            line-height: 1.4;
        }

        .moony {
            font-family: 'Lora', serif;
            font-weight: 600;
            color: white;
            margin-top: 8px;
            font-size: 11px;
            letter-spacing: 0.5px;
            opacity: 0.8;
        }

        @media (min-width: 480px) {
            .card {
                max-width: 420px;
            }
            
            .input-group {
                flex-direction: row;
            }
            
            input {
                flex: 2;
            }
            
            button {
                flex: 1;
                width: auto;
            }
            
            .jar-section {
                padding: 28px 24px 16px;
            }
            
            .question-mark {
                font-size: 64px;
            }
            
            .title {
                font-size: 22px;
            }
            
            .hint {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <div class="logo">MOONY</div>
            <div class="badge">CANDY CHALLENGE</div>
        </div>

        <div class="jar-section">
            <div class="question-mark">?</div>
            <div class="title">Сколько M&M's в банке?</div>
            <div class="sub">Угадай точное количество</div>
            <span class="hint">от 300 до 600</span>
        </div>

        <div class="form-section">
            <div class="input-group">
                <input type="number" id="guessInput" placeholder="Введите число">
                <button id="guessBtn">Угадать</button>
            </div>
            <div id="result" class="result"></div>
        </div>

        <div class="rules">
            <p>Угадай точное количество — забери всю банку конфет</p>
            <div class="moony">MOONY</div>
        </div>
    </div>

    <script>
        const CORRECT_NUMBER = 591;
        const MAX_ATTEMPTS = 10;
        
        let attemptsLeft = MAX_ATTEMPTS;
        let gameActive = true;
        let gameWon = false;
        
        const guessInput = document.getElementById('guessInput');
        const guessBtn = document.getElementById('guessBtn');
        const resultDiv = document.getElementById('result');
        
        function endGame(message, isWin = false) {
            gameActive = false;
            guessInput.disabled = true;
            guessBtn.disabled = true;
            
            resultDiv.classList.add('show');
            if (isWin) {
                resultDiv.className = 'result win show';
            } else {
                resultDiv.className = 'result blocked show';
            }
            resultDiv.innerHTML = message;
        }
        
        function showResult(guess, isWin) {
            if (isWin) {
                gameWon = true;
                const winMessage = `
                    <div style="font-size: 17px; margin-bottom: 6px; font-weight: 600;">🎉 ПОБЕДА! 🎉</div>
                    <div>В банке ${CORRECT_NUMBER} конфет — вы угадали!</div>
                    <div class="prize-text">Заберите свой приз в киоске MOONY! 🎁</div>
                `;
                endGame(winMessage, true);
            } else {
                const loseMessage = `
                    <div style="font-size: 17px; margin-bottom: 6px; font-weight: 600;">Эх, не угадали...</div>
                    <div class="prize-text">Попробуйте ещё раз! 🍀</div>
                `;
                resultDiv.className = 'result lose show';
                resultDiv.innerHTML = loseMessage;
                resultDiv.classList.add('show');
                
                setTimeout(() => {
                    if (gameActive && !gameWon) {
                        resultDiv.classList.remove('show');
                    }
                }, 1500);
            }
        }
        
        function handleGuess() {
            if (!gameActive || gameWon) return;
            
            const guess = parseInt(guessInput.value, 10);
            
            if (isNaN(guess) || guess < 1 || guess > 2000) {
                resultDiv.classList.add('show');
                resultDiv.className = 'result lose show';
                resultDiv.innerHTML = `<div>Введите число от 1 до 2000</div>`;
                setTimeout(() => {
                    if (gameActive && !gameWon) {
                        resultDiv.classList.remove('show');
                    }
                }, 1500);
                return;
            }
            
            const isWin = (guess === CORRECT_NUMBER);
            
            if (isWin) {
                showResult(guess, true);
                return;
            }
            
            attemptsLeft--;
            
            if (attemptsLeft === 0) {
                const blockedMessage = `
                    <div style="font-size: 17px; margin-bottom: 6px; font-weight: 600;">⚠️ Попытки закончились ⚠️</div>
                    <div class="prize-text">Спасибо за участие!</div>
                `;
                endGame(blockedMessage, false);
                return;
            }
            
            showResult(guess, false);
            guessInput.value = '';
            guessInput.focus();
        }
        
        guessBtn.addEventListener('click', handleGuess);
        guessInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleGuess();
        });
        guessInput.focus();
    </script>
</body>
</html>
